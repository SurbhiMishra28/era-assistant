services:
  - type: web
    name: dentera
    runtime: node
    plan: free
    rootDir: apps/dental
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_LOGIN
        value: "1"
      - key: NVIDIA_API_KEY
        sync: false
